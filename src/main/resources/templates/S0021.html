<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>売上検索結果表示</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/teamb.css}">

    <style>

        body{
            background:#f5f5f5;
            font-family:"Yu Gothic",sans-serif;
        }

        .container-box{
            width:1250px;
            margin:50px auto;
        }

        h1{
            font-size:64px;
            margin-bottom:40px;
            color:#222;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            border-bottom:2px solid #ddd;
            padding:18px 10px;
            text-align:left;
            font-size:20px;
            background:#f8f8f8;
        }

        td{
            border-bottom:1px solid #ddd;
            padding:18px 10px;
            font-size:18px;
            vertical-align:middle;
        }

        .detail-btn{
            background:#2f80c9;
            color:white;
            border:none;
            border-radius:5px;
            width:80px;
            height:45px;
            font-size:18px;
            font-weight:bold;
        }

        .detail-btn:hover{
            opacity:0.9;
        }

        .subtotal{
            font-weight:bold;
        }

    </style>

</head>

<body>

<div th:replace="fragment/navbar :: navbar('sales/search')"></div>

<div class="container-box">

    <h1>売上検索結果表示</h1>

    <table>

        <tr>

            <!-- 操作 -->
            <th>操作</th>

            <!-- No -->
            <th>No</th>

            <!-- 販売日 -->
            <th>販売日</th>

            <!-- 担当 -->
            <th>担当</th>

            <!-- 商品カテゴリー -->
            <th>商品カテゴリー</th>

            <!-- 商品名 -->
            <th>商品名</th>

            <!-- 単価 -->
            <th>単価</th>

            <!-- 個数 -->
            <th>個数</th>

            <!-- 小計 -->
            <th>小計</th>

        </tr>

        <!-- 検索結果 -->

        <tr th:each="sales : ${salesList}">

            <!-- 操作 -->

            <td>

                <form th:action="@{/sales/detail}"
                      method="get">

                    <input type="hidden"
                           name="saleId"
                           th:value="${sales.saleId}">

                    <button type="submit"
                            class="detail-btn">

                        <i class="bi bi-check-lg"></i>
                        詳細

                    </button>

                </form>

            </td>

            <!-- No -->

            <td th:text="${sales.saleId}">
            </td>

            <!-- 販売日 -->

            <td th:text="${sales.saleDate}">
            </td>

            <!-- 担当 -->

			<td>
			    <span th:each="account : ${accountList}">
			        <span th:if="${account.accountId == sales.accountId}" th:text="${account.name}">
			        </span>

			    </span>

			</td>

            <!-- 商品カテゴリー -->

			<td>
			    <span th:each="category : ${categoryList}">
			        <span th:if="${category.categoryId == sales.categoryId}"
			              th:text="${category.categoryName}">
			        </span>
			    </span>

			</td>

            <!-- 商品名 -->

            <td th:text="${sales.tradeName}">
            </td>

            <!-- 単価 -->

            <td th:text="${#numbers.formatInteger(sales.unitPrice, 0, 'COMMA')}">
				
            </td>

            <!-- 個数 -->

            <td th:text="${#numbers.formatInteger(sales.saleNumber, 0, 'COMMA')}">
            </td>

            <!-- 小計 -->

			<td class="subtotal"
			    th:text="${#numbers.formatDecimal(sales.unitPrice * sales.saleNumber,
			        0,'COMMA',0,'POINT')}">
			</td>

        </tr>

    </table>

</div>

</body>

</html>
