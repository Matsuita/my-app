<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
		  rel="stylesheet">
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet"
		  th:href="@{/teamb.css}">

	<title>売上登録</title>

</head>

<body>
	<div th:replace="fragment/navbar :: navbar('sales')"></div>

	<h1>売上登録</h1>

	<form th:action="@{/S0011}"
		  th:object="${salesCreateForm}"
		  method="post">

		<!-- 販売日 -->
		<div>
			販売日　＜必須＞
			<input type="date"
				   th:field="*{saleDate}">
			<div th:errors="*{saleDate}">
			</div>
		</div>

		<!-- 担当 -->
		<div>
			担当　＜必須＞
			<select th:field="*{accountId}">
				<option value="">
					選択してください
				</option>
				<option th:each="account : ${accountList}"
						th:value="${account.accountId}"
						th:text="${account.name}">
				</option>
			</select>
			<div th:errors="*{accountId}">
			</div>
		</div>

		<!-- 商品カテゴリー -->
		<div>
			商品カテゴリー　＜必須＞
			<select th:field="*{categoryId}">
				<option value="">
					選択してください
				</option>
				<option th:each="category : ${categoryList}"
						th:value="${category.categoryId}"
						th:text="${category.categoryName}">
				</option>
			</select>
			<div th:errors="*{categoryId}">
			</div>
		</div>

		<!-- 商品名 -->
		<div>
			商品名　＜必須＞
			<input type="text"
				   th:field="*{tradeName}"
				   placeholder="商品名">
			<div th:errors="*{tradeName}">
			</div>
		</div>

		<!-- 単価 -->

		<div>
			単価　＜必須＞
			<input type="text"
				   th:field="*{unitPrice}"
				   placeholder="単価">
			<div th:errors="*{unitPrice}">
			</div>
		</div>
		
		<!-- 個数 -->
		<div>
			個数　＜必須＞
			<input type="text"
				   th:field="*{saleNumber}"
				   placeholder="個数">
			<div th:errors="*{saleNumber}">
			</div>
		</div>

		<!-- 備考 -->
		<div>
			備考
			<input type="text"
				   th:field="*{note}"
				   placeholder="備考">
			<div th:errors="*{note}">
			</div>
		</div>

		<!-- ボタン -->
		<button type="submit">
			登録
		</button>

	</form>

</body>

</html>
