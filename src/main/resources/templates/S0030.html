<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント登録</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">
	<style>
		.error {
			color: red;
			font-size: 0.9em;
		}
	</style>
</head>

<body>
	<div th:replace="fragment/navbar :: navbar('S0030')"></div>
	<h1>アカウント登録</h1>

	<form th:action="@{/S0031}" th:object="${accountForm}" method="post">
		<p>氏名
			<span class="partial-badge">必須</span>
			<input type="text" th:field="*{name}" placeholder="氏名">
			<span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
			</span><!-- このタグでエラーの記述を呼び出す -->
		</p>

		<p>メールアドレス
			<span class="partial-badge">必須</span>
			<input type="text" th:field="*{mail}" placeholder="メールアドレス">

			<span class="error" th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}">
			</span><!-- このタグでエラーの記述を呼び出す -->
		</p>

		<p>パスワード
			<span class="partial-badge">必須</span>
			<input type="password" th:field="*{password}" placeholder="パスワード">
			<span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
			</span><!-- このタグでエラーの記述を呼び出す -->
		</p>

		<p>パスワード（確認）
			<span class="partial-badge">必須</span>
			<input type="password" th:field="*{passwordConfirm}" placeholder="パスワード（確認）">
			<span class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">
			</span><!-- このタグでエラーの記述を呼び出す -->
		</p>

		<p>売上権限
			<span class="partial-badge">必須</span>
			<input type="radio" th:field="*{salesAuthority}" value="0">権限なし
			<input type="radio" th:field="*{salesAuthority}" value="1">閲覧のみ
			<input type="radio" th:field="*{salesAuthority}" value="2">登録・編集
			<span class="error" th:if="${#fields.hasErrors('salesAuthority')}" th:errors="*{salesAuthority}">-->
			</span>

		</p>

		<p>アカウント権限
			<span class="partial-badge">必須</span>
			<input type="radio" th:field="*{accountsAuthority}" value="0">権限なし
			<input type="radio" th:field="*{accountsAuthority}" value="1">閲覧のみ
			<input type="radio" th:field="*{accountsAuthority}" value="2">登録・編集
			<span class="error" th:if="${#fields.hasErrors('accountsAuthority')}" th:errors="*{accountsAuthority}">-->
			</span>
		</p>

		<!--			<input type="radio" th:field="*{authority}" value="0" />権限なし-->
		<!--			<input type="radio" th:field="*{authority}" value="1" />売上登録-->
		<!--			<input type="radio" th:field="*{authority}" value="2" />アカウント登録-->
		<!--			<input type="radio" th:field="*{authority}" value="3" />売上登録＋アカウント登録-->
		<!--			<span class="error" th:if="${#fields.hasErrors('authority')}" th:errors="*{authority}">-->
		<!--			</span> このタグでエラーの記述を呼び出す -->



		<p><button type="submit">登録</button></p>

	</form>

</body>

</html>
