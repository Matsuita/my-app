<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント登録</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">

</head>

<body>
	<div th:replace="fragment/navbar :: navbar('accounts')"></div>
	<div class="main-box">

		<div class="title">アカウント登録</div>

		<form th:action="@{/accounts/confirm}" th:object="${accountForm}" method="post" id="accounts" class="form-area">

			<!-- 氏名 -->
			<div class="form-row">
				<div class="form-label">
					<span class="label-text">氏名</span>
					<span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{name}" placeholder="氏名">
					<div class="error" th:errors="*{name}"></div>
				</div>
			</div>

			<!-- メール -->
			<div class="form-row">
				<div class="form-label">
					<span class="label-text">メールアドレス</span><span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{mail}" placeholder="メールアドレス">
					<div class="error" th:errors="*{mail}"></div>
				</div>
			</div>

			<!-- パスワード -->
			<div class="form-row">
				<div class="form-label">
					<span class="label-text">パスワード</span><span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<div class="password-wrap">
					<input type="text" id="password" th:field="*{password}" class="mask" placeholder="パスワード">
					<i class="bi bi-eye-fill" id="togglePassword"></i></div>
					<div class="error" th:errors="*{password}"></div>
				</div>
			</div>

			<!-- 確認 -->
			<div class="form-row">
				<div class="form-label">
					<span class="label-text">パスワード（確認）</span><span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<div class="password-wrap">
					<input type="text" id="passwordConfirm" th:field="*{passwordConfirm}" class="mask" placeholder="パスワード（確認）">
					<i class="bi bi-eye-fill" id="togglePasswordConfirm"></i></div>
					<div class="error" th:errors="*{passwordConfirm}"></div>
				</div>
			</div>

			<!-- 売上権限 -->
			<div class="form-row">
				<div class="form-label">
					<span class="label-text">売上権限</span><span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<div class="radio-group">
						<label><input type="radio" th:field="*{salesAuthority}" value="0"> 権限なし</label>
						<label><input type="radio" th:field="*{salesAuthority}" value="1"> 閲覧のみ</label>
						<label><input type="radio" th:field="*{salesAuthority}" value="2"> 登録・編集</label>
					</div>
					<div class="error" th:errors="*{salesAuthority}"></div>
				</div>
			</div>

			<!-- アカウント権限 -->
			<div class="form-row">
				<div class="form-label">
					<span class="label-text">アカウント権限</span><span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<div class="radio-group">
						<label><input type="radio" th:field="*{accountsAuthority}" value="0"> 権限なし</label>
						<label><input type="radio" th:field="*{accountsAuthority}" value="1"> 閲覧のみ</label>
						<label><input type="radio" th:field="*{accountsAuthority}" value="2"> 登録・編集</label>
					</div>
					<div class="error" th:errors="*{accountsAuthority}"></div>
				</div>
			</div>

			
		</form>
		<!-- ボタン -->
					<div class="btn-area-center">
						<button type="submit" form="accounts" class="btn btn-primary">
							<i class="bi bi-check2-circle"></i>
							確認
						</button>
					</div>

	</div>
	<script th:src="@{/script.js}" defer></script>
</body>

</html>
