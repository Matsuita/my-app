<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント検索</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">


</head>

<body>
	<div th:replace="fragment/navbar :: navbar('account/search')"></div>
	<div class="main-box">

		<div class="title">アカウント検索条件入力</div>

		<form th:action="@{/accounts/result}" th:object="${accountSearchForm}" method="post">

			<!-- 氏名 -->
			<div class="form-row">
				<div class="form-label">
					氏名
					<span class="badge-gray">部分一致</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{name}" placeholder="氏名">
					<div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
				</div>
			</div>

			<!-- メール -->
			<div class="form-row">
				<div class="form-label">
					メールアドレス
				</div>
				<div class="form-input">
					<input type="text" th:field="*{mail}" placeholder="メールアドレス">
					<div class="error" th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}"></div>
				</div>
			</div>

			<!-- 売上権限 -->
			<div class="form-row">
				<div class="form-label">
					売上権限
				</div>
				<div class="form-input radio-group">
					<label><input type="checkbox" name="salesAuthority" value="0"> 権限なし</label>
					<label><input type="checkbox" name="salesAuthority" value="1"> 閲覧のみ</label>
					<label><input type="checkbox" name="salesAuthority" value="2"> 登録・編集</label>
				</div>
			</div>

			<!-- アカウント権限 -->
			<div class="form-row">
				<div class="form-label">
					アカウント権限
				</div>
				<div class="form-input radio-group">
					<label><input type="checkbox" name="accountsAuthority" value="0"> 権限なし</label>
					<label><input type="checkbox" name="accountsAuthority" value="1"> 閲覧のみ</label>
					<label><input type="checkbox" name="accountsAuthority" value="2"> 登録・編集</label>
				</div>
			</div>

			<!-- ボタン -->
			<div class="btn-area-center">
				<button type="submit" class="btn btn-primary">
					<i class="bi bi-search"></i>検索
				</button>

				<!--				<button type="reset" class="btn btn-secondary">-->
				<!--					クリア-->
				<!--				</button>-->


				<button type="button" class="btn btn-secondary" onclick="location.href='/accounts/search'">
					クリア
				</button>
			</div>


		</form>
	</div>
	<script th:src="@{/script.js}" defer></script>
</body>

</html>
