<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント登録確認</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">
</head>

<body>

	<div th:replace="fragment/navbar :: navbar('accounts/register')"></div>

	<div class="main-box">
		<div class="form-box">

			<div class="title">アカウント登録確認</div>

			<form th:object="${accountForm}" method="post">

				<!-- 氏名 -->
				<div class="form-row">
					<div class="form-label">氏名 <span class="badge-gray">必須</span></div>
					<div class="form-input">
						<input type="hidden" th:field="*{name}">
						<input type="text" th:value="*{name}" readonly>
					</div>
				</div>

				<!-- メール -->
				<div class="form-row">
					<div class="form-label">メールアドレス <span class="badge-gray">必須</span></div>
					<div class="form-input">
						<input type="hidden" th:field="*{mail}">
						<input type="text" th:value="*{mail}" readonly>
					</div>
				</div>

				<!-- パスワード -->
				<div class="form-row">
					<div class="form-label">パスワード <span class="badge-gray">必須</span></div>
					<div class="form-input">
						<input type="hidden" th:field="*{password}">
						<input type="text"
							th:value="${accountForm.password != null ? #strings.repeat('•', accountForm.password.length()) : ''}"
							readonly>
					</div>
				</div>

				<!-- パスワード確認 -->
				<!--				<div class="form-row">-->
				<!--					<div class="form-label">パスワード（確認） <span class="badge-gray">必須</span></div>-->
				<!--					<div class="form-input">-->
				<input type="hidden" th:field="*{passwordConfirm}">
				<!--						<input type="text"-->
				<!--							th:value="${accountForm.passwordConfirm != null ? #strings.repeat('•', accountForm.passwordConfirm.length()) : ''}"-->
				<!--							readonly>-->
				<!--					</div>-->
				<!--				</div>-->

				<!-- 売上権限 -->
				<div class="form-row">
					<div class="form-label">売上権限 <span class="badge-gray">必須</span></div>
					<div class="form-input">
						<input type="hidden" th:field="*{salesAuthority}" />
						<div class="radio-group radio-disabled-look">
							<label><input type="radio" th:checked="${accountForm.salesAuthority == 0}" onclick="return false">
								権限なし</label>
							<label><input type="radio" th:checked="${accountForm.salesAuthority == 1}" onclick="return false">
								閲覧のみ</label>
							<label><input type="radio" th:checked="${accountForm.salesAuthority == 2}" onclick="return false">
								登録・編集</label>
						</div>
					</div>
				</div>

				<!-- アカウント権限 -->
				<div class="form-row">
					<div class="form-label">アカウント権限 <span class="badge-gray">必須</span></div>
					<div class="form-input">
						<input type="hidden" th:field="*{accountsAuthority}" />
						<div class="radio-group radio-disabled-look">
							<label><input type="radio" th:checked="${accountForm.accountsAuthority == 0}" onclick="return false">
								権限なし</label>
							<label><input type="radio" th:checked="${accountForm.accountsAuthority == 1}" onclick="return false">
								閲覧のみ</label>
							<label><input type="radio" th:checked="${accountForm.accountsAuthority == 2}" onclick="return false">
								登録・編集</label>
						</div>
					</div>
				</div>

				<!-- ボタン -->
				<div class="btn-area-center">
					<button type="submit" class="btn btn-primary" th:formaction="@{/accounts/confirm_register}">
						<i class="bi bi-plus-circle"></i>登録
					</button>

					<button type="submit" class="btn btn-secondary" th:formaction="@{/accounts_back}">
						キャンセル
					</button>
				</div>

			</form>

		</div>
	</div>
	<script th:src="@{/script.js}" defer></script>
</body>

</html>
