<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント詳細編集</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		.form-area {
			max-width: 700px;
			margin: 60px auto;
		}

		.label-col {
			width: 180px;
		}

		.radio-group label {
			margin-right: 15px;
		}

		.error-text {
			color: red;
			font-size: 13px;
		}
	</style>
</head>

<body>

	<div class="form-area">

		<h2 class="mb-4">アカウント詳細編集</h2>

		<form th:action="@{/accounts/confirm}" method="post">

			<!-- 氏名 -->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>氏名</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col">
					<input type="text" name="name" class="form-control" th:value="${account.name}">
					<div class="error-text" th:if="${nameError}" th:text="${nameError}"></div>
				</div>
			</div>

			<!-- メールアドレス -->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>メールアドレス</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col">
					<input type="text" name="mail" class="form-control" th:value="${account.mail}">
					<div class="error-text" th:if="${mailError}" th:text="${mailError}"></div>
				</div>
			</div>

			<!-- パスワード 　-->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>パスワード</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col">
					<input type="password" name="password" class="form-control">
					<div class="error-text" th:if="${passwordError}" th:text="${passwordError}"></div>
				</div>
			</div>

			<!-- パスワード -->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>パスワード（確認）</label><span class="partial-badge">必須</span>

				</div>
				<div class="col">
					<input type="password" name="passwordConfirm" class="form-control">
					<div class="error-text" th:if="${passwordConfirmError}" th:text="${passwordConfirmError}"></div>
				</div>
			</div>

			<!-- 権限 -->
			<div class="row mb-4 align-items-center">
				<div class="col-auto label-col">
					<label>権限</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col radio-group">
					<label>
						<input type="radio" name="authority" value="0" th:checked="${account.authority == 0}"> 権限なし
					</label>
					<label>
						<input type="radio" name="authority" value="1" th:checked="${account.authority == 1}"> 売上登録
					</label>
					<label>
						<input type="radio" name="authority" value="2" th:checked="${account.authority == 2}"> アカウント登録
					</label>
				</div>
			</div>

			<!-- ボタン -->
			<div class="text-center">

				<!-- 更新ボタン（POST送信） -->
				

					<button type="submit">更新</button>
			
				<button type="submit" th:formaction="@{/accounts/result}">
					キャンセル
				</button>


			</div>
		</form>

	</div>

</body>

</html>
