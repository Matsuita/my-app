<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント詳細編集</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/teamb.css}">



</head>

<div th:replace="fragment/navbar :: navbar('account/search')"></div>
<div class="main-box">

	<div class="form-box">

		<div class="title">アカウント詳細編集</div>


		<form th:action="@{/accounts/edit/confirm}" th:object="${accountUpdateForm}" method="post">
			<input type="hidden" th:field="*{accountId}">
			<!-- 氏名 -->
			<div class="form-row">
				<div class="form-label">
					氏名
					<span class="partial-badge">必須</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{name}">
					<div class="error" th:errors="*{name}"></div>
				</div>
			</div>

			<!-- メールアドレス -->
			<div class="form-row">
				<div class="form-label">
					メールアドレス
					<span class="partial-badge">必須</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{mail}">
					<div class="error" th:errors="*{mail}"></div>
				</div>
			</div>



			<!-- パスワード -->
			<div class="form-row">
				<div class="form-label">
					パスワード
					<span class="partial-badge">必須</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{password}" class="mask">
					<div class="error" th:errors="*{password}"></div>
				</div>
			</div>

			<!-- パスワード確認 -->
			<div class="form-row">
				<div class="form-label">
					<label>パスワード（確認）</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{passwordConfirm}" class="mask">
					<div class="error" th:errors="*{passwordConfirm}"></div>
					<div class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}"
						th:text="${err}">
					</div>
				</div>
			</div>


			<!-- 売上権限 -->
			<div class="form-row">
				<div class="form-label">
					<label>売上権限</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="form-input radio-group">
					<label>
						<input type="radio" th:field="*{salesAuthority}" value="0">権限なし
					</label>
					<label>
						<input type="radio" th:field="*{salesAuthority}" value="1"> 閲覧のみ
					</label>
					<label>
						<input type="radio" th:field="*{salesAuthority}" value="2"> 登録・編集
					</label>
				</div>
			</div>

			<!-- アカウント権限 -->
			<div class="form-row">
				<div class="form-label">
					<label>アカウント権限</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="form-input radio-group">
					<label>
						<input type="radio" th:field="*{accountsAuthority}" value="0">権限なし
					</label>
					<label>
						<input type="radio" th:field="*{accountsAuthority}" value="1"> 閲覧のみ
					</label>
					<label>
						<input type="radio" th:field="*{accountsAuthority}" value="2"> 登録・編集
					</label>
				</div>
			</div>

			<!-- ボタン -->
			<div class="btn-area-center">

				<!-- 更新ボタン（POST送信） -->


				<button type="submit" class="btn btn-primary"><i class="bi bi-clipboard2-plus-fill"></i>確認</button>


				<a th:href="@{/accounts/result}" class="btn btn-secondary">
					キャンセル
				</a>

			</div>
		</form>

	</div>
</div>
<script th:src="@{/script.js}" defer></script>
</body>

</html>
