<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント詳細編集</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		.form-area {
			max-width: 700px;
			margin: 60px auto;
		}

		.label-col {
			width: 180px;
		}

		.radio-group label {
			margin-right: 15px;
		}

		.error-text {
			color: red;
			font-size: 13px;
		}
	</style>
</head>

<body>
	<div th:replace="fragment/navbar :: navbar('account/search')"></div>
	<div class="form-area">

		<h2 class="mb-4">アカウント詳細編集</h2>

		<form th:action="@{/accounts/confirm}" th:object="${accountUpdateForm}" method="post">
			<input type="hidden" th:field="*{accountId}">
			<!-- 氏名 -->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>氏名</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col">
					<input type="text" class="form-control" th:field="*{name}">
					<div class="error-text" th:errors="*{name}"></div>
				</div>
			</div>

			<!-- メールアドレス -->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>メールアドレス</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col">
					<input type="text" class="form-control" th:field="*{mail}">
					<div class="error-text" th:errors="*{mail}"></div>
				</div>
			</div>
			


			<!-- パスワード -->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>パスワード</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col">
					<input type="password" th:field="*{password}" class="form-control">
					<div class="error-text" th:errors="*{password}"></div>
				</div>
			</div>

			<!-- パスワード確認 -->
			<div class="row mb-3 align-items-center">
				<div class="col-auto label-col">
					<label>パスワード（確認）</label>
					<span class="partial-badge">必須</span>
				</div>
				<div class="col">
					<input type="password" th:field="*{passwordConfirm}" class="form-control">
					<div class="error-text" th:errors="*{passwordConfirm}"></div>
					<div class="error-text" th:if="${#fields.hasGlobalErrors()}"
						th:each="err : ${#fields.globalErrors()}" th:text="${err}">
					</div>
				</div>
			</div>
	

	<!-- 権限 -->
	<div class="row mb-4 align-items-center">
		<div class="col-auto label-col">
			<label>権限</label>
			<span class="partial-badge">必須</span>
		</div>
		<div class="col radio-group">
			<label>
				<input type="radio" th:field="*{authority}" value="0">権限なし
			</label>
			<label>
				<input type="radio" th:field="*{authority}" value="1"> 売上登録
			</label>
			<label>
				<input type="radio" th:field="*{authority}" value="2"> アカウント登録
			</label>
		</div>
	</div>

	<!-- ボタン -->
	<div class="text-center">

		<!-- 更新ボタン（POST送信） -->


		<button type="submit" class="btn btn-primary">更新</button>


		<a th:href="@{/accounts/result}" class="btn btn-secondary">
			キャンセル
		</a>

	</div>
	</form>

	</div>

</body>

</html>
