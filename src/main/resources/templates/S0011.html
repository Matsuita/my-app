<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
		  rel="stylesheet">
	<link rel="stylesheet"
		  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet"
		  th:href="@{/teamb.css}">
		  
	<title>売上登録確認</title>
	
</head>

<body>
	<div th:replace="fragment/navbar :: navbar('sales')"></div>

		<h1>売上登録確認</h1>
		<table>
			<!-- 販売日 -->
			<tr>
				<th>販売日</th>
				<td th:text="*{saleDate}"></td>
			</tr>
			
			<!-- 担当 -->
			<tr>
				<th>担当</th>
				<td th:text="*{account.name}"></td>
			</tr>

			<!-- 商品カテゴリー -->
			<tr>
				<th>商品カテゴリー</th>
				<td th:text="*{category.categoryName}"></td>
			</tr>

			<!-- 商品名 -->
			<tr>
				<th>商品名</th>
				<td th:text="*{tradeName}"></td>
			</tr>

			<!-- 単価 -->
			<tr>
				<th>単価</th>
				<td th:text="*{unitPrice}"></td>
			</tr>

			<!-- 個数 -->
			<tr>
				<th>個数</th>
				<td th:text="*{saleNumber}"></td>
			</tr>

			<!-- 小計 -->
			<tr>
				<th>小計</th>
				<td th:text="${sale.unitPrice != null && sale.saleNumber != null ? sale.unitPrice * sale.saleNumber : ''}">
			</tr>

			<!-- 備考 -->
			<tr>
				<th>備考</th>
				<td th:text="*{note}"></td>
			</tr>
			
			</table>

		<form th:action="@{/salesCreate}"
				th:object="${salesCreateForm}"
				method="post">
						  
			<input type="hidden" th:value="*{saleDate}">
			<input type="hidden" th:value="*{accountId}">
			<input type="hidden" th:value="*{categoryId}">
			<input type="hidden" th:value="*{tradeName}">
			<input type="hidden" th:value="*{unitPrice}">
			<input type="hidden" th:value="*{saleNumber}">
			<input type="hidden" th:value="*{note}">
					
			<!-- ボタン -->
			<button type="submit">
				登録
			</button>
			
			<a th:href="@{/S0010}">
				キャンセル
			</a>
			
		</form>

	</body>

</html>
