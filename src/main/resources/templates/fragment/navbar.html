<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">
</head>

<body>


	<nav th:fragment="navbar(active)" class="navbar fixed-top">

		<span class="navbar-brand">
			物品売上管理システム
		</span>

		<div class="menu">

			<a class="nav-link" 
				th:classappend="${active == 'dashboard'} ? ' active'" 
				th:href="@{/dashboard}">
				ダッシュボード
			</a>

			<a class="nav-link" 
				th:if="${session.loginUser.salesAuthority == 2}"
				th:classappend="${active == 'sales'} ? ' active'" 
				th:href="@{/S0010}">
				売上登録
			</a>

			<a class="nav-link" 
				th:if="${session.loginUser.salesAuthority >= 1}"
				th:classappend="${active == 'sales/search'} ? ' active'" 
				th:href="@{/S0020}">
				売上検索
			</a>

			<a class="nav-link" 
				th:if="${session.loginUser.accountsAuthority == 2}"
				th:classappend="${active == 'S0030'} ? ' active'" 
				th:href="@{/S0030}">
				アカウント登録
			</a>

			<a class="nav-link" 
				th:if="${session.loginUser.accountsAuthority  >= 1}"
				th:classappend="${active == 'account/search'} ? ' active'"
				th:href="@{/accounts/search}">
				アカウント検索
			</a>

		</div>

		<a class="nav-link logout" th:href="@{/logout}">
			ログアウト
		</a>

	</nav>

</body>

</html>
