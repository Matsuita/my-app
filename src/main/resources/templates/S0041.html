<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント検索結果表示</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		body {
			background-color: #f8f9fa;
		}

		.container {
			margin-top: 40px;
		}

		table {
			background-color: white;
		}
	</style>
</head>

<body>
	<div th:replace="fragment/navbar :: navbar('account/search')"></div>
	<div class="container">

		<h2>アカウント検索結果表示</h2>

		<table class="table table-bordered align-middle">
			<thead class="table-light">
				<tr>
					<th>操作</th>
					<th>No</th>
					<th>氏名</th>
					<th>メールアドレス</th>
					<th>権限</th>
				</tr>
			</thead>

			<tbody>

				<!-- データ表示 -->
				<tr th:each="a, stat : ${accounts}">
					<td>

						<a th:href="@{/accounts/edit/{id}(id=${a.accountId})}" class="btn btn-primary btn-sm">
							<i class="bi bi-pencil"></i> 編集
						</a>

						<form th:action="@{/accounts/delete}" method="post" style="display:inline;">
							<input type="hidden" name="accountId" th:value="${a.accountId}">
							<input type="hidden" name="name" th:value="${a.name}">
							<input type="hidden" name="mail" th:value="${a.mail}">
							<input type="hidden" name="salesAuthority" th:value="${a.salesAuthority}">
							<input type="hidden" name="accountsAuthority" th:value="${a.accountsAuthority}">
							<input type="hidden" name="password" th:value="${a.password}">
							<input type="hidden" name="passwordConfirm" th:value="${a.passwordConfirm}">

							<button type="submit" class="btn btn-danger btn-sm">
								<i class="bi bi-x"></i> 削除
							</button>
						</form>
					</td>

					<td th:text="${a.accountId}">1</td>
					<td th:text="${a.name}">山田 太郎</td>
					<td th:text="${a.mail}">test@test.com</td>

					<td th:switch="${a.salesAuthority}">
						<span th:case="0">権限なし</span>
						<span th:case="1">閲覧のみ</span>
						<span th:case="2">登録・編集</span>
					</td>
					<td th:switch="${a.accountsAuthority}">
						<span th:case="0">権限なし</span>
						<span th:case="1">閲覧のみ</span>
						<span th:case="2">登録・編集</span>
					</td>


					<!--					<td th:switch="${a.authority}">-->
					<!--						<span th:case="0">権限なし</span>-->
					<!--						<span th:case="1">売上登録</span>-->
					<!--						<span th:case="2">アカウント登録</span>-->
					<!--						<span th:case="3">売上登録・アカウント登録</span>-->
					<!--					</td>-->
				</tr>

				<!-- データなし -->
				<tr th:if="${accounts == null or #lists.isEmpty(accounts)}">
					<td colspan="5" class="text-center">データがありません</td>
				</tr>

			</tbody>
		</table>

	</div>

</body>

</html>
