<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント詳細削除</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
		<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		.form-area {
			max-width: 700px;
			margin: 60px auto;
		}

		.label-col {
			width: 180px;
		}

		.radio-group label {
			margin-right: 15px;
		}

		.error-text {
			color: red;
			font-size: 13px;
		}
		
		.display-like-input {
		    display: block;
		    width: 100%;
		    padding: 0.375rem 0.75rem;
		    font-size: 1rem;
		    line-height: 1.5;
		    color: #212529;;
		    background-color: #e9ecef;
		    border: 1px solid #ced4da;
		    border-radius: 0.375rem;
		}
	</style>
</head>
<div th:replace="fragment/navbar :: navbar('account/search')"></div>
<div class="form-area">

	<h2 class="mb-4">アカウント詳細削除確認</h2>

	<form th:action="@{/accounts/delete/execute}" th:object="${account}" method="post">
		
		<input type="hidden" th:field="*{accountId}">

		<!-- 氏名 -->
		
		<div class="row mb-3 align-items-center">
			<div class="col-auto label-col">
				<label>氏名</label>
				
			</div>
			<div class="col">
				<input type="hidden" name="name" class="form-control" th:field="*{name}">
				<span class="display-like-input" th:text="*{name}"></span><!-- 表示用 -->
				<div class="error-text" th:if="${nameError}" th:text="${nameError}"></div>
			</div>
		</div>

		<!-- メールアドレス -->
		<div class="row mb-3 align-items-center">
			<div class="col-auto label-col">
				<label>メールアドレス</label>
				
			</div>
			<div class="col">
				<input type="hidden" name="mail" class="form-control" th:field="*{mail}">
				<span class="display-like-input" th:text="*{mail}"></span><!-- 表示用 -->
				<div class="error-text" th:if="${mailError}" th:text="${mailError}"></div>
			</div>
		</div>

		<div class="row mb-3 align-items-center">
		    <div class="col-auto label-col">
		        <label>パスワード</label>
		        
		    </div>
		    <div class="col">
		        <!-- hiddenはth:fieldだけ -->
		        <input type="hidden" th:field="*{password}">

		        <!-- ●表示にする -->
				<span class="display-like-input" th:text="${account.password != null ? #strings.repeat('•', account.password.length()) : ''}"></span>

		        <div class="error-text"
		             th:if="${passwordError}"
		             th:text="${passwordError}"></div>
		    </div>
		</div>

		

		<!-- 権限 -->
		<div class="row mb-4 align-items-center">
			<div class="col-auto label-col">
				<label>権限</label>
				
			</div>
			<div class="col radio-group">
<!--				<input type="hidden" th:field="*{authority}">-->
<!--				<span class="display-like-input" th:if="*{authority == 0}">権限なし</span>-->
<!--				<span class="display-like-input" th:if="*{authority == 1}">売上登録</span>-->
<!--				<span class="display-like-input" th:if="*{authority == 2}">アカウント登録</span>-->

<input type="hidden" name="authority" th:value="${account.authority}">

<label>
  <input type="radio" value="0"
         th:checked="${account.authority == 0}" disabled> 権限なし
</label>
<label>
  <input type="radio" value="1"
         th:checked="${account.authority == 1}" disabled> 売上登録
</label>
<label>
  <input type="radio" value="2"
         th:checked="${account.authority == 2}" disabled> アカウント登録
</label>
			</div>
		</div>

		<!-- ボタン -->
		<div class="text-center">
			<button type="submit" class="btn btn-danger">
			   削除
			</button>

			<a th:href="@{/accounts/result}" class="btn btn-secondary">
				キャンセル
			</a>
		</div>

	</form>

</div>



</body>

</html>
