<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>売上詳細削除確認画面</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<link rel="stylesheet"
      th:href="@{/teamb.css}">

<style>

    body{
        background:#f5f5f5;
        font-family:"Yu Gothic",sans-serif;
    }

    .delete-container{
        width:760px;
        margin:60px auto 40px auto;
    }

    h1{
        font-size:42px;
        margin-bottom:30px;
        color:#222;
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    tr{
        border-bottom:1px solid #ddd;
    }

    th{
        width:220px;
        padding:16px;
        text-align:left;
        font-size:16px;
        font-weight:bold;
        color:#222;
        background:transparent;
    }

    td{
        padding:16px;
        font-size:15px;
        color:#333;
    }

    .button-area{
        margin-top:25px;
        text-align:center;
    }

    .delete-btn{
        width:110px;
        height:44px;
        border:none;
        border-radius:5px;
        background:#e25555;
        color:white;
        font-size:16px;
        font-weight:bold;
        margin-right:10px;
    }

    .cancel-btn{
        width:120px;
        height:44px;
        border:1px solid #ccc;
        border-radius:5px;
        background:white;
        color:#333;
        font-size:16px;
        font-weight:bold;
        text-decoration:none;
        display:inline-flex;
        align-items:center;
        justify-content:center;
    }

    .btn-icon{
        margin-right:4px;
    }

</style>

</head>

<body>

<div th:replace="fragment/navbar :: navbar('sales/search')"></div>

<div class="delete-container">

    <h1>売上詳細削除確認</h1>

    <table>

		<tr>
			<th>販売日</th>
			<td th:text="${sales.saleDate}"></td>
        </tr>
		
		<tr>
			<th>担当</th>
			<td>
				<span th:each="account : ${accountList}">
					<span th:if="${account != null and account.accountId == sales.accountId}"
                          th:text="${account.name}">
					</span>
				</span>
			</td>
		</tr>

		<tr>
			<th>商品カテゴリー</th>
			<td>
				<span th:each="category : ${categoryList}">
					<span th:if="${category != null and category.categoryId == sales.categoryId}"
                          th:text="${category.categoryName}"></span>
				</span>
			</td>
		</tr>

		<tr>
			<th>商品名</th>
			<td th:text="${sales.tradeName}"></td>
		</tr>

		<tr>
			<th>単価</th>
			<td th:text="${#numbers.formatInteger(sales.unitPrice, 0, 'COMMA')}"></td>
		</tr>

		<tr>
			<th>個数</th>
			<td th:text="${#numbers.formatInteger(sales.saleNumber, 0, 'COMMA')}"></td>
		</tr>

		<tr>
			<th>小計</th>
			<td th:text="${#numbers.formatInteger(sales.unitPrice * sales.saleNumber, 0, 'COMMA')}"></td>
		</tr>

		<tr>
			<th>備考</th>
			<td th:text="${sales.note}">
			</td>
		</tr>
	</table>

    <!-- 送信用 -->

    <form th:action="@{/sales/delete/execute}" th:object="${sales}" method="post">
        <input type="hidden" name="saleId" th:value="${sales.saleId}">

        <!-- ボタン -->

        <div class="button-area">
            <button type="submit" class="delete-btn">
                <i class="bi bi-trash btn-icon"></i>削除</button>
            <a th:href="@{/sales/detail(saleId=${sales.saleId})}"class="cancel-btn">キャンセル</a>
        </div>

    </form>

</div>

</body>

</html>
