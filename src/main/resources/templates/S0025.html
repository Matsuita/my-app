<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>売上詳細削除確認画面</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<link rel="stylesheet" th:href="@{/teamb.css}">

</head>

<body>

	<div th:replace="fragment/navbar :: navbar('sales/search')"></div>

	<div class="main-box">
		<div class="form-box">
			<div class="title">売上詳細削除確認</div>

			<!-- 表示エリア（table → form-row化） -->

			<div class="form-row">
				<div class="form-label">販売日</div>
				<div class="form-input short">
					<input type="text" th:value="${sales.saleDate}" readonly>
				</div>
			</div>

			<div class="form-row">
				<div class="form-label">担当</div>
				<div class="form-input">
					<input type="text" readonly
						th:each="account : ${accountList}"
						th:if="${account != null and account.accountId == sales.accountId}"
						th:value="${account.name}">
				</div>
			</div>

			<div class="form-row">
				<div class="form-label">商品カテゴリー</div>
				<div class="form-input">
					<input type="text" readonly
						th:each="category : ${categoryList}"
						th:if="${category != null and category.categoryId == sales.categoryId}"
						th:value="${category.categoryName}">
				</div>
			</div>

			<div class="form-row">
				<div class="form-label">商品名</div>
				<div class="form-input">
					<input type="text" th:value="${sales.tradeName}" readonly>
				</div>
			</div>

			<div class="form-row">
				<div class="form-label">単価</div>
				<div class="form-input short">
					<input type="text"
						th:value="${#numbers.formatInteger(sales.unitPrice, 0, 'COMMA')}"
						readonly>
				</div>
			</div>

			<div class="form-row">
				<div class="form-label">個数</div>
				<div class="form-input short">
					<input type="text"
						th:value="${#numbers.formatInteger(sales.saleNumber, 0, 'COMMA')}"
						readonly>
				</div>
			</div>

			<div class="form-row">
				<div class="form-label">小計</div>
				<div class="form-input short">
					<input type="text"
						th:value="${#numbers.formatInteger(sales.unitPrice * sales.saleNumber, 0, 'COMMA')}"
						readonly>
				</div>
			</div>

			<div class="form-row">
				<div class="form-label">備考</div>
				<div class="form-input">
				    <textarea readonly th:text="${sales.note}"></textarea>
				</div>
			</div>

			<!-- 送信フォーム（機能そのまま） -->
			<form th:action="@{/sales/delete/execute}" method="post">
				<input type="hidden" name="saleId" th:value="${sales.saleId}">

				<div class="btn-area-center">
				       <button type="submit" class="btn btn-danger">
						<i class="bi bi-trash"></i> 削除
					</button>
					<a th:href="@{/sales/detail(saleId=${sales.saleId})}" class="btn btn-secondary">
						キャンセル
					</a>
				</div>
			</form>

		</div>
	</div>

</body>
</html>
