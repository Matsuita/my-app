<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>売上詳細表示</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet"
          th:href="@{/teamb.css}">

    <style>

        body{
            background:#f5f5f5;
            font-family:"Yu Gothic",sans-serif;
        }

		.container-box{
		    width:760px;
		    margin:60px auto 40px auto;
		}

		h1{
		    font-size:42px;
		    margin-bottom:30px;
		    color:#222;
		}

		table{
		    width:100%;
		    border-collapse:collapse;
		    margin-left:0;
		}

		tr{
		    border-bottom:1px solid #ddd;
		}

		th{
		    width:200px;
		    padding:16px;
		    text-align:left;
		    font-size:16px;
		    font-weight:bold;
		    color:#222;
		    background:#f7f7f7;
		}

		td{
		    padding:16px;
		    font-size:15px;
		    color:#333;
		}

		.button-area{
		    margin-top:25px;
		    margin-left:190px;
		}

		.edit-btn{
		    width:110px;
		    height:44px;
		    border:none;
		    border-radius:5px;
		    background:#2f80c9;
		    color:white;
		    font-size:16px;
		    font-weight:bold;
		    margin-right:10px;
		}

		.delete-btn{
		    width:110px;
		    height:44px;
		    border:none;
		    border-radius:5px;
		    background:#e25555;
		    color:white;
		    font-size:16px;
		    font-weight:bold;
		    margin-right:10px;
		}

		.cancel-btn{
		    width:120px;
		    height:44px;
		    border:1px solid #ccc;
		    border-radius:5px;
		    background:white;
		    color:#333;
		    font-size:16px;
		    font-weight:bold;
		}

		.btn-icon{
		    margin-right:4px;
		}

    </style>

</head>

<body>

<div th:replace="fragment/navbar :: navbar('sales/search')"></div>

<div class="container-box">

    <h1>売上詳細表示</h1>

    <table>

        <!-- 販売日 -->

        <tr>

            <th>販売日</th>

            <td th:text="${sales.saleDate}">
            </td>

        </tr>

        <!-- 担当 -->

        <tr>

            <th>担当</th>

			<td>

			    <span th:each="account : ${accountList}">
			        <span th:if="${account.accountId == sales.accountId}"
			              th:text="${account.name}">
			        </span>
			    </span>
			</td>

        </tr>

        <!-- 商品カテゴリー -->

        <tr>

            <th>商品カテゴリー</th>

			<td>

			    <span th:each="category : ${categoryList}">
			        <span th:if="${category.categoryId == sales.categoryId}"
			              th:text="${category.categoryName}">
			        </span>
			    </span>

			</td>

        </tr>

        <!-- 商品名 -->

        <tr>

            <th>商品名</th>

            <td th:text="${sales.tradeName}">
            </td>

        </tr>

        <!-- 単価 -->

        <tr>

            <th>単価</th>

            <td th:text="${sales.unitPrice}">
            </td>

        </tr>

        <!-- 個数 -->

        <tr>

            <th>個数</th>

            <td th:text="${sales.saleNumber}">
            </td>

        </tr>

        <!-- 小計 -->

        <tr>

            <th>小計</th>

            <td th:text="${sales.unitPrice * sales.saleNumber}">
            </td>

        </tr>

        <!-- 備考 -->

        <tr>

            <th>備考</th>

            <td th:text="${sales.note}">
            </td>

        </tr>

    </table>

    <!-- ボタン -->

    <div class="button-area">

        <!-- 編集 -->

        <form th:action="@{/sales/edit}"
              method="get"
              style="display:inline;">

            <input type="hidden"
                   name="saleId"
                   th:value="${sales.saleId}">

            <button type="submit"
                    class="edit-btn">

                <i class="bi bi-check-lg btn-icon"></i>
                編 集

            </button>

        </form>

        <!-- 削除 -->

        <form th:action="@{/sales/delete}"
			  th:object="${sales}"
              method="post"
              style="display:inline;">

            <input type="hidden" name="saleId"
			 th:value="${sales.saleId}">
			 
			 <input type="hidden" name="saleDate"
			  th:value="${sales.saleDate}">
				   
			<input type="hidden" name="accountId"
			 th:value="${sales.accountId}">
									  
			<input type="hidden" name="categoryId"
			 th:value="${sales.categoryId}">
			
			<input type="hidden" name="tradeName"
			 th:value="${sales.tradeName}">
			
			<input type="hidden" name="unitPrice"
			 th:value="${sales.unitPrice}">
			
			<input type="hidden" name="saleNumber"
			 th:value="${sales.saleNumber}">
			
			<input type="hidden" name="saleSum"
			 th:value="${sales.unitPrice * sales.saleNumber}">
			
			<input type="hidden" name="saleNote"
			 th:value="${sales.note}">

			
            <button type="submit"
                    class="delete-btn">

                <i class="bi bi-x-lg btn-icon"></i>
                削 除

            </button>

        </form>

        <!-- キャンセル -->

		<form th:action="@{/S0021}"
		      method="get"
		      style="display:inline;">

		    <button type="submit"
		            class="cancel-btn">

		        キャンセル

		    </button>

		</form>

    </div>

</div>

</body>

</html>
