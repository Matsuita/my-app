<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>売上詳細表示</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<link rel="stylesheet" th:href="@{/teamb.css}">


</head>

<body>

	<div th:replace="fragment/navbar :: navbar('sales/search')"></div>
	<div class="main-box">

		<div class="form-box">
			<div class="title">売上詳細表示</div>


			<!-- 販売日 -->
			<div class="form-row">
				<div class="form-label">販売日</div>
				<div class="form-input"><span th:text="${#temporals.format(
				    sales.saleDate,
				    'yyyy/MM/dd')}"></span></div>
			</div>


			<!-- 担当 -->
			<div class="form-row">

			    <div class="form-label">
			        担当
			    </div>

			    <div class="form-input">
			        <span th:each="account : ${accountList}">
			            <span th:if="${account.accountId == sales.accountId}">
			                <span th:if="${account.active}" th:text="${account.name}">
			                </span>
			                <span th:unless="${account.active}">
			                    （退職済みユーザー）
			                </span>
			            </span>
			        </span>

			    </div>

			</div>

			<!-- 商品カテゴリー -->
			<div class="form-row">
				<div class="form-label">商品カテゴリー</div>
				<div class="form-input">
					<span th:each="category : ${categoryList}">
						<span th:if="${category.categoryId == sales.categoryId}" th:text="${category.categoryName}">
						</span>
					</span>
				</div>
			</div>


			<!-- 商品名 -->
			<div class="form-row">
				<div class="form-label">商品名</div>
				<div class="form-input"><span th:text="${sales.tradeName}"></span></div>
			</div>



			<!-- 単価 -->
			<div class="form-row">
				<div class="form-label">単価</div>
				<div class="form-input"><span th:text="${#numbers.formatInteger(sales.unitPrice, 0, 'COMMA')}"></span>
				</div>
			</div>


			<!-- 個数 -->
			<div class="form-row">
				<div class="form-label">個数</div>
				<div class="form-input"><span th:text="${#numbers.formatInteger(sales.saleNumber, 0, 'COMMA')}"></span>
				</div>
			</div>


			<!-- 小計 -->
			<div class="form-row">
				<div class="form-label">小計</div>
				<div class="form-input"><span th:text="${#numbers.formatInteger(sales.unitPrice.longValue() * sales.saleNumber.longValue(),
				0, 'COMMA')}"></span></div>
			</div>


			<!-- 備考 -->
			<div class="form-row">
				<div class="form-label">備考</div>
				<div class="form-input"><span th:text="${sales.note}"></span></div>
			</div>


			<!-- ボタン -->

			<div class="btn-area-center">

				<!-- 編集 -->

				<a th:href="@{/sales/edit/{id}(id=${sales.saleId})}"
				   class="btn btn-primary">

				    <i class="bi bi-pencil"></i>
				    編 集

				</a>

				<!-- 削除 -->

				<form th:action="@{/sales/delete/{id}(id=${sales.saleId})}" th:object="${sales}" method="post" style="display:inline;">

					<input type="hidden" name="saleId" th:value="${sales.saleId}">

					<input type="hidden" name="saleDate" th:value="${sales.saleDate}">

					<input type="hidden" name="accountId" th:value="${sales.accountId}">

					<input type="hidden" name="categoryId" th:value="${sales.categoryId}">

					<input type="hidden" name="tradeName" th:value="${sales.tradeName}">

					<input type="hidden" name="unitPrice" th:value="${sales.unitPrice}">

					<input type="hidden" name="saleNumber" th:value="${sales.saleNumber}">

					<input type="hidden" name="saleSum" th:value="${sales.unitPrice * sales.saleNumber}">

					<input type="hidden" name="saleNote" th:value="${sales.note}">


					<button type="submit" class="btn btn-danger">

						<i class="bi bi-x"></i>
						削 除

					</button>

				</form>

				<!-- キャンセル -->

				<form th:action="@{/sales/result}" method="get" style="display:inline;">

					<button type="submit" class="btn btn-secondary">

						キャンセル

					</button>

				</form>

			</div>

		</div>
	</div>
	<script th:src="@{/script.js}" defer></script>
</body>

</html>
