<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">
</head>

<body>
	<nav class="navbar fixed-top">

	    <!-- タイトル -->
	    <span class="navbar-brand">
	        物品売上管理システム
	    </span>

	    <!-- メニュー -->
	    <div class="menu">

	        <a class="nav-link"
	           th:classappend="${#httpServletRequest.requestURI == '/dashboard'} ? ' active'"
	           th:href="@{/dashboard}">
	           ダッシュボード
	        </a>

	        <a class="nav-link"
	           th:classappend="${#httpServletRequest.requestURI == '/sales/register'} ? ' active'"
	           th:href="@{/sales/register}">
	           売上登録
	        </a>

	        <a class="nav-link"
	           th:classappend="${#httpServletRequest.requestURI == '/sales/search'} ? ' active'"
	           th:href="@{/sales/search}">
	           売上検索
	        </a>

	        <a class="nav-link"
	           th:classappend="${#httpServletRequest.requestURI == '/accounts/register'} ? ' active'"
	           th:href="@{/accounts/register}">
	           アカウント登録
	        </a>

	        <a class="nav-link"
	           th:classappend="${#httpServletRequest.requestURI == '/accounts/search'} ? ' active'"
	           th:href="@{/accounts/search}">
	           アカウント検索
	        </a>

	    </div>

	    <!-- ログアウト -->
	    <a class="nav-link logout"
	       th:href="@{/logout}">
	       ログアウト
	    </a>

	</nav>
	<p>ここはダッシュボードのHTMLです。</p>
	
</body>
</html>
