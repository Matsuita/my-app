<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>売上詳細編集</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<link rel="stylesheet" th:href="@{/teamb.css}">



</head>

<body>

	<div th:replace="fragment/navbar :: navbar('sales/search')"></div>

	<div class="main-box">

		<!-- ★タイトルもclass合わせる -->
		<div class="title">売上詳細編集</div>

		<form th:action="@{/sales/edit/confirm/{id}(id=${salesForm.saleId})}" th:object="${salesForm}" method="post">

			<!-- ID -->

			<input type="hidden" th:field="*{saleId}">

			<!-- 権限 -->

			<input type="hidden" th:field="*{authority}">

			<!-- 販売日 -->

			<div class="form-row">
				<div class="form-label">
					販売日 <span class="badge-gray">必須</span>
				</div>
				<div class="form-input short">
					<input type="date" th:field="*{saleDate}">
					<div class="error" th:errors="*{saleDate}"></div>
				</div>
			</div>


			<!-- 担当 -->

			<div class="form-row">
				<div class="form-label">
					担当 <span class="badge-gray">必須</span>
				</div>
				<div class="form-input">




					<div th:if="${accountName == '（退職済みユーザー）'}">

						<input type="text" class="form-control" value="（退職済みユーザー）" readonly>

						<input type="hidden" th:field="*{accountId}">

					</div>

					<select th:unless="${accountName == '（退職済みユーザー）'}" th:field="*{accountId}">

						<option value="">
							選択してください
						</option>

						<option th:each="account : ${accountList}" th:value="${account.accountId}"
							th:text="${account.name}">
						</option>

					</select>

					<div class="error" th:errors="*{accountId}">
					</div>

				</div>

			</div>

			<!-- 商品カテゴリー -->

			<div class="form-row">
				<div class="form-label">
					商品カテゴリー <span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<select th:field="*{categoryId}">
						<option value="">選択してください</option>
						<option th:each="category : ${categoryList}" th:value="${category.categoryId}"
							th:text="${category.categoryName}">
						</option>
					</select>
					<div class="error" th:errors="*{categoryId}"></div>
				</div>
			</div>

			<!-- 商品名 -->

			<div class="form-row">
				<div class="form-label">
					商品名 <span class="badge-gray">必須</span>
				</div>
				<div class="form-input">
					<input type="text" th:field="*{tradeName}">
					<div class="error" th:errors="*{tradeName}"></div>
				</div>
			</div>


			<!-- 単価 -->

			<div class="form-row">
				<div class="form-label">
					単価 <span class="badge-gray">必須</span>
				</div>

				<div class="form-input short">

					<input type="text" th:field="*{unitPrice}">

					<!-- BeanValidation -->

					<div class="error" th:errors="*{unitPrice}">
					</div>

					<!-- 形式エラー -->

					<div class="error" th:text="${unitPriceError}">
					</div>

				</div>

			</div>

			<!-- 個数 -->

			<div class="form-row">
				<div class="form-label">
					個数 <span class="badge-gray">必須</span>
				</div>


				<div class="form-input short">


					<input type="text" th:field="*{saleNumber}">

					<div class="error" th:errors="*{saleNumber}">
					</div>
					<div class="error" th:text="${saleNumberError}">
					</div>

				</div>

			</div>

			<!-- 備考 -->

			<div class="form-row">
				<div class="form-label">備考</div>
				<div class="form-input">
					<textarea th:field="*{note}"></textarea>
					<div class="error" th:errors="*{note}"></div>
				</div>
			</div>

			<!-- 権限エラー -->

			<div class="error-message" style="margin-left:200px;" th:text="${errorMessage}">
			</div>

			<!-- ボタン -->

			<div class="btn-area-center">

			    <button type="submit"
			            class="btn btn-primary">

			        <i class="bi bi-check-lg btn-icon"></i>
			        確認

			    </button>

			    <button type="button"
			            class="btn btn-secondary"

			            th:onclick="|location.href='@{/sales/detail/{id}(id=${salesForm.saleId})}'|">

			        キャンセル

			    </button>

			</div>

		</form>

	</div>

</body>

</html>
