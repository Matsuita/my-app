<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>売上詳細編集</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

	<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		body {
			background: #f5f5f5;
			font-family: "Yu Gothic", sans-serif;
			padding-bottom: 80px;
		}

		.edit-container {
			width: 760px;
			margin: 60px auto 40px auto;
		}

		h1 {
			font-size: 42px;
			margin-bottom: 30px;
			color: #222;
		}

		.form-row {
			display: flex;
			align-items: flex-start;
			margin-bottom: 16px;
		}

		.label-area {
			width: 180px;
			text-align: right;
			margin-right: 20px;
			font-size: 16px;
			font-weight: bold;
			color: #222;
			padding-top: 10px;
		}

		.required-badge {
			background: #7b7b7b;
			color: white;
			border-radius: 20px;
			font-size: 11px;
			padding: 2px 8px;
			margin-left: 6px;
		}

		.input-area {
			width: 460px;
		}

		.text-input {
			width: 100%;
			height: 44px;
			border: 1px solid #d6d6d6;
			border-radius: 5px;
			padding-left: 14px;
			font-size: 15px;
			background: white;
		}

		.small-input {
			width: 170px;
		}

		.textarea-input {
			width: 100%;
			height: 130px;
			border: 1px solid #d6d6d6;
			border-radius: 5px;
			padding: 12px;
			font-size: 15px;
			resize: none;
			background: white;
		}

		select {
			width: 100%;
			height: 44px;
			border: 1px solid #d6d6d6;
			border-radius: 5px;
			padding-left: 14px;
			font-size: 15px;
			background: white;
		}

		.error-message {
			color: red;
			font-size: 12px;
			margin-top: 4px;
		}

		.button-area {
			margin-top: 25px;
			margin-left: 200px;
		}

		.update-btn {
			width: 110px;
			height: 44px;
			border: none;
			border-radius: 5px;
			background: #2f80c9;
			color: white;
			font-size: 16px;
			font-weight: bold;
			margin-right: 10px;
		}

		.cancel-btn {
			width: 120px;
			height: 44px;
			border: 1px solid #ccc;
			border-radius: 5px;
			background: white;
			color: #333;
			font-size: 16px;
			font-weight: bold;
		}

		.btn-icon {
			margin-right: 4px;
		}
	</style>

</head>

<body>

	<div th:replace="fragment/navbar :: navbar('sales/search')"></div>

	<div class="edit-container">

		<h1>売上詳細編集</h1>

		<form th:action="@{/S0024}" th:object="${salesForm}" method="post">

			<!-- ID -->

			<input type="hidden" th:field="*{saleId}">

			<!-- 権限 -->

			<input type="hidden" th:field="*{authority}">

			<!-- 販売日 -->

			<div class="form-row">

				<div class="label-area">

					販売日

					<span class="required-badge">
						必須
					</span>

				</div>

				<div class="input-area">

					<input type="date" class="text-input small-input" th:field="*{saleDate}">

					<div class="error-message" th:errors="*{saleDate}">
					</div>

				</div>

			</div>

			<!-- 担当 -->

			<div class="form-row">

			    <div class="label-area">

			        担当

			        <span class="required-badge">
			            必須
			        </span>

			    </div>

			    <div class="input-area">

			        <div th:if="${accountName == '（退職済みユーザー）'}">

			            <input type="text"
			                   class="form-control"
			                   value="（退職済みユーザー）"
			                   readonly>

			            <input type="hidden"
			                   th:field="*{accountId}">

			        </div>

			        <select th:unless="${accountName == '（退職済みユーザー）'}"
			                th:field="*{accountId}">

			            <option value="">
			                選択してください
			            </option>

			            <option th:each="account : ${accountList}"
			                    th:value="${account.accountId}"
			                    th:text="${account.name}">
			            </option>

			        </select>

			        <div class="error-message"
			             th:errors="*{accountId}">
			        </div>

			    </div>

			</div>

			<!-- 商品カテゴリー -->

			<div class="form-row">

				<div class="label-area">

					商品カテゴリー

					<span class="required-badge">
						必須
					</span>

				</div>

				<div class="input-area">

					<select th:field="*{categoryId}">

						<option value="">
							選択してください
						</option>

						<option th:each="category : ${categoryList}" th:value="${category.categoryId}"
							th:text="${category.categoryName}">
						</option>

					</select>

					<div class="error-message" th:errors="*{categoryId}">
					</div>

				</div>

			</div>

			<!-- 商品名 -->

			<div class="form-row">

				<div class="label-area">

					商品名

					<span class="required-badge">
						必須
					</span>

				</div>

				<div class="input-area">

					<input type="text" class="text-input" th:field="*{tradeName}">

					<div class="error-message" th:errors="*{tradeName}">
					</div>

				</div>

			</div>

			<!-- 単価 -->

			<div class="form-row">

				<div class="label-area">

					単価

					<span class="required-badge">
						必須
					</span>

				</div>

				<div class="input-area">

					<input type="text" class="text-input small-input" th:field="*{unitPrice}">

					<!-- BeanValidation -->

					<div class="error-message" th:errors="*{unitPrice}">
					</div>

					<!-- 形式エラー -->

					<div class="error-message" th:text="${unitPriceError}">
					</div>

				</div>

			</div>

			<!-- 個数 -->

			<div class="form-row">

				<div class="label-area">

					個数

					<span class="required-badge">
						必須
					</span>

				</div>

				<div class="input-area">

					<input type="text" class="text-input small-input" th:field="*{saleNumber}">

					<div class="error-message" th:errors="*{saleNumber}">
					</div>
					<div class="error-message"
					     th:text="${saleNumberError}">
					</div>

				</div>

			</div>

			<!-- 備考 -->

			<div class="form-row">

				<div class="label-area">
					備考
				</div>

				<div class="input-area">

					<textarea class="textarea-input"
					          th:field="*{note}">
					</textarea>

					<div class="error-message"
					     th:errors="*{note}">
					</div>

				</div>

			</div>

			<!-- 権限エラー -->

			<div class="error-message" style="margin-left:200px;" th:text="${errorMessage}">
			</div>

			<!-- ボタン -->

			<div class="button-area">

				<button type="submit" class="update-btn">

					<i class="bi bi-check-lg btn-icon"></i>
					更新

				</button>
				<button type="button"
				        class="cancel-btn"
				        th:onclick="|location.href='@{/sales/detail(saleId=${salesForm.saleId})}'|">


				    キャンセル

				</button>

			</div>

		</form>

	</div>

</body>

</html>
