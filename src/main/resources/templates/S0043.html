<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント詳細編集確認</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
		<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		.form-area {
			max-width: 700px;
			margin: 60px auto;
		}

		.label-col {
			width: 180px;
		}

		.radio-group label {
			margin-right: 15px;
		}

		.error-text {
			color: red;
			font-size: 13px;
		}
	</style>

</head>

<body>
	
	<div th:replace="fragment/navbar :: navbar('account/search')"></div>
		<div class="form-area">
			<form th:action="@{/accounts/update}" th:object="${account}" method="post">

	<!-- ID（非表示のまま） -->
	<input type="hidden" th:field="*{accountId}">

	<!-- 氏名 -->
	<input type="hidden" th:field="*{name}">
	<div class="row mb-3 align-items-center">
	  <div class="col-auto label-col">
	    <label>氏名</label>
	  </div>
	  <div class="col">
	    <input type="text" th:value="*{name}" class="form-control" readonly>
	  </div>
	</div>

	<!-- メール -->
	<input type="hidden" th:field="*{mail}">
	<div class="row mb-3 align-items-center">
	  <div class="col-auto label-col">
	    <label>メールアドレス</label>
	  </div>
	  <div class="col">
	    <input type="email" th:value="*{mail}" class="form-control" readonly>
	  </div>
	</div>

	

	<!-- 表示 -->
	<input type="hidden" th:field="*{password}">
	<div class="row mb-3 align-items-center">
	  <div class="col-auto label-col">
	    <label>パスワード</label>
	  </div>
	  <div class="col">
		<input type="password"
		       th:value="${#strings.repeat('•', account.password.length())}"
		       class="form-control"
		       readonly>

	  </div>
	</div>

	
	<input type="hidden" th:field="*{passwordConfirm}">

	<div class="row mb-3 align-items-center">
	  <div class="col-auto label-col">
	    <label>パスワード（確認）</label>
	  </div>
	  <div class="col">
		<input type="password"
		       th:value="${#strings.repeat('•', account.passwordConfirm.length())}"
		       class="form-control"
		       readonly>
	  </div>
	</div>

	<!-- 権限（ボタン表示・編集不可） -->
	<input type="hidden" th:field="*{authority}">
	<div class="row mb-3 align-items-center">
	  <div class="col-auto label-col">
	    <label>権限</label>
	  </div>
	  <div class="col">

	    <div class="form-check form-check-inline">
	      <input class="form-check-input" type="radio"
	             th:checked="*{authority == 0}" disabled>
	      <label class="form-check-label">権限なし</label>
	    </div>

	    <div class="form-check form-check-inline">
	      <input class="form-check-input" type="radio"
	             th:checked="*{authority == 1}" disabled>
	      <label class="form-check-label">売上登録</label>
	    </div>

	    <div class="form-check form-check-inline">
	      <input class="form-check-input" type="radio"
	             th:checked="*{authority == 2}" disabled>
	      <label class="form-check-label">アカウント登録</label>
	    </div>

	  </div>
	</div>
	<button type="submit" class="btn btn-primary">
					更新
				</button>
				<a th:href="@{/accounts/result}" class="btn btn-secondary">
				    キャンセル
				</a>
			</form>

</body>

</html>
