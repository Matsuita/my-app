<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント詳細編集確認</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
		<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		.form-area {
			max-width: 700px;
			margin: 60px auto;
		}

		.label-col {
			width: 180px;
		}

		.radio-group label {
			margin-right: 15px;
		}

		.error-text {
			color: red;
			font-size: 13px;
		}
	</style>

</head>

<body>
	<div th:replace="fragment/navbar :: navbar('account/search')"></div>
	<div class="form-area">

		<h2 class="mb-4">アカウント詳細編集確認</h2>
		<form th:action="@{/accounts/update}" th:object="${account}" method="post">
			<p>ID: <span th:text="${account.accountId}"></span></p>
			<input type="hidden" th:field="*{accountId}">
			
			<!-- 氏名 -->
			<input type="hidden" th:field="*{name}">
			<p>氏名：<span th:text="*{name}"></span></p>

			<!-- メール -->
			<input type="hidden" th:field="*{mail}">
			<p>メール：<span th:text="*{mail}"></span></p>

			<!-- パスワード -->
			<input type="hidden" th:field="*{password}">
			<p>パスワード：<span th:text="*{password}"></span></p>

			<!-- 確認 -->
			<input type="hidden" th:field="*{passwordConfirm}">
			<p>確認：<span th:text="*{passwordConfirm}"></span></p>

			<!-- 権限 -->
			<input type="hidden" th:field="*{authority}">
			<p>
				権限：
				<span th:if="*{authority == '0'}">権限なし</span>
				<span th:if="*{authority == '1'}">売上登録</span>
				<span th:if="*{authority == '2'}">アカウント登録</span>
			</p>

			<!-- ボタン -->
			
			<button type="submit" class="btn btn-primary">
				更新
			</button>
					<a th:href="@{/accounts/edit/{id}(id=${account.accountId})}" class="btn btn-secondary">
				キャンセル
			</a>
		</form>
	</div>
</body>

</html>
