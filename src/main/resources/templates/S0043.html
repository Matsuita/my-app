<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>アカウント詳細編集確認</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/teamb.css}">

	<style>
		.form-area {
			max-width: 700px;
			margin: 60px auto;
		}

		.label-col {
			width: 180px;
		}

		.radio-group label {
			margin-right: 15px;
		}

		.error-text {
			color: red;
			font-size: 13px;
		}

		.display-like-input {
			display: block;
			width: 100%;
			padding: 0.375rem 0.75rem;
			font-size: 1rem;
			line-height: 1.5;
			color: #212529;
			;
			background-color: #e9ecef;
			border: 1px solid #ced4da;
			border-radius: 0.375rem;
		}
		
		.form-check-input {
		  appearance: auto;
		}
	</style>

</head>

<body>

	<div th:replace="fragment/navbar :: navbar('account/search')"></div>
	<div class="form-area">
		<div class="text-center mb-5">
			<h2 class="text-start">アカウント詳細編集確認</h2>
		</div>
		<form th:action="@{/accounts/update}" th:object="${accountUpdateForm}" method="post">

	<input type="hidden" th:field="*{accountId}">
	<input type="hidden" th:field="*{name}">
	<input type="hidden" th:field="*{mail}">
	<input type="hidden" th:field="*{password}">
	<input type="hidden" th:field="*{passwordConfirm}">
	<input type="hidden" th:field="*{authority}">

	<!-- 氏名 -->
	<div class="row mb-3 align-items-center">
	  <div class="col-3 text-end">氏名</div>
	  <div class="col-9">
	    <input type="text" th:value="*{name}" class="form-control" disabled>
	  </div>
	</div>

	<!-- メール -->
	<div class="row mb-3 align-items-center">
	  <div class="col-3 text-end">メールアドレス</div>
	  <div class="col-9">
	    <input type="text" th:value="*{mail}" class="form-control" disabled>
	  </div>
	</div>

	<!-- パスワード -->
	<div class="row mb-3 align-items-center">
	  <div class="col-3 text-end">パスワード</div>
	  <div class="col-9">
	    <input type="text"
	           th:value="${#strings.repeat('•', accountUpdateForm.password.length())}"
	           class="form-control"
	           disabled>
	  </div>
	</div>

	<!-- パスワード確認 -->
<!--	<div class="row mb-3 align-items-center">-->
<!--	  <div class="col-3 text-end">パスワード（確認）</div>-->
<!--	  <div class="col-9">-->
<!--	    <input type="text"-->
<!--	           th:value="${#strings.repeat('•', account.passwordConfirm.length())}"-->
<!--	           class="form-control"-->
<!--	           disabled>-->
<!--	  </div>-->
<!--	</div>-->

	<!-- 権限 -->
	<div class="row mb-4 align-items-center">
	  <div class="col-3 text-end">権限</div>
	  <div class="col-9">

	    <div class="d-flex gap-3">
	      <div class="form-check">
	        <input class="form-check-input" type="radio" th:checked="*{authority == 0}" disabled>
	        <label class="form-check-label">権限なし</label>
	      </div>

	      <div class="form-check">
	        <input class="form-check-input" type="radio" th:checked="*{authority == 1}" disabled>
	        <label class="form-check-label">売上登録</label>
	      </div>

	      <div class="form-check">
	        <input class="form-check-input" type="radio" th:checked="*{authority == 2}" disabled>
	        <label class="form-check-label">アカウント登録</label>
	      </div>
	    </div>

	  </div>
	</div>

	<!-- ボタン中央寄せ -->
	<div class="text-center">
	  <button type="submit" class="btn btn-primary px-4">
	    <i class="bi bi-check-lg"></i> OK
	  </button>

	  <a th:href="@{/accounts/edit/{id}(id=*{accountId})}" class="btn btn-outline-secondary px-4 ms-2">
	    キャンセル
	  </a>
	</div>

	
		</form>
	</div>
</body>

</html>
